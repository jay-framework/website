  - id: jay-text:mask-shimmer-pass
    title: Shimmer pass
    category: Text
    subCategory: Masks & Effects
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a shimmer pass text effect at this marker location on the page.
    prompt: |
      Add a "Shimmer Pass" text element to the page.
      A single highlight stripe sweeps across the text once every 5 seconds, then
      disappears — giving the impression of light briefly catching the letterforms.
      During idle the shine layer is fully invisible, parked off-screen.
      
      Implementation uses two layers:
      - A base span with the visible text color
      - A shine span absolutely positioned on top, using background-clip: text with
        a narrow white gradient as the highlight stripe
      
      Key properties that make it work correctly:
      - background-size: 200% auto — makes the gradient tile twice the element width
      - background-repeat: no-repeat — prevents the tile from repeating, which would
        cause multiple visible stripes
      - background-position animates from -150% (fully off-screen left) to 150%
        (fully off-screen right) — the extra 50% on each side ensures the bright
        center of the stripe clears the element edge completely during idle
      - The sweep occupies keyframes 15%→35% of the 5s cycle (~1 second), the
        remaining 4 seconds are idle with the stripe parked off-screen
      
      The text content, base color, highlight opacity, sweep duration, and interval
      (animation duration) should be configurable via props.
      Important: the shine span must duplicate the text content exactly.
      
      Example:
      <div class="shimmer-pass">
        <style>
          @scope {
            @keyframes shimmer-pass {
              0%   { background-position: -150% center; }
              15%  { background-position: -150% center; }
              35%  { background-position:  150% center; }
              100% { background-position:  150% center; }
            }
            .wrap { position: relative; display: inline-block; font-size: clamp(36px, 4vw, 56px); font-weight: 900; font-family: sans-serif; line-height: 1; }
            .base { color: #1a1a1a; }
            .shine {
              position: absolute; top: 0; left: 0;
              background: linear-gradient(
                105deg,
                transparent 35%,
                rgba(255,255,255,0.6)  46%,
                rgba(255,255,255,0.95) 50%,
                rgba(255,255,255,0.6)  54%,
                transparent 65%
              );
              background-size: 200% auto;
              background-repeat: no-repeat;
              -webkit-background-clip: text;
              background-clip: text;
              color: transparent;
              animation: shimmer-pass 5s ease-in-out infinite;
            }
          }
        </style>
        <div class="wrap">
          <span class="base">HELLO</span>
          <span class="shine">HELLO</span>
        </div>
      </div>
    presentation:
      type: html-fragment
      html: |
        <div class="shimmer-pass-widget">
          <style>
            @scope {
              @keyframes shimmer-pass {
                0%    { background-position: -150% center; }
                15%   { background-position: -150% center; }
                35%   { background-position:  150% center; }
                100%  { background-position:  150% center; }
              }
              .wrap { position: relative; display: inline-block; font-size: clamp(36px, 4vw, 56px); font-weight: 900; font-family: sans-serif; line-height: 1; }
              .base { color: #1a1a1a; }
              .shine {
                position: absolute; top: 0; left: 0;
                background: linear-gradient(
                  105deg,
                  transparent 35%,
                  rgba(255,255,255,0.6)  46%,
                  rgba(255,255,255,0.95) 50%,
                  rgba(255,255,255,0.6)  54%,
                  transparent 65%
                );
                background-size: 200% auto;
                background-repeat: no-repeat;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                animation: shimmer-pass 5s ease-in-out infinite;
              }
              .badge { font-size:10px; background:#F1EFE8; color:#444441; border-radius:999px; padding:2px 8px; margin-top:8px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <div class="wrap">
            <span class="base">SHIMMER</span>
            <span class="shine" aria-hidden="true">SHIMMER</span>
          </div>
          <div class="badge">single shimmer pass</div>
        </div>
      browse:
        size: small
