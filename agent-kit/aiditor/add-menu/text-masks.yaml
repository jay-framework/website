  - id: jay-text:path-spinning-orbit
    title: Spinning orbit rings
    category: Text
    subCategory: Masks & Effects
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add spinning orbit ring text paths at this marker location on the page.
    prompt: |
      Add a "Spinning Orbit Rings" element to the page.
      Two concentric circular SVG text paths rotate together as a single unit using
      a CSS animation on a wrapping <g> element (transform-origin at the SVG center).
      Both <textPath> elements are inside the same <g> so they spin in sync.
      A static bold label (e.g. a year or brand name) sits at the center of the SVG,
      outside the spinning <g>, so it remains stationary.
      Each circle path is defined as an SVG arc (A command) — use radius values that
      give comfortable spacing between the two rings. The text must fill the full
      circumference of each circle; repeat the string as needed.
      The outer ring text, inner ring text, center label, ring colors, rotation speed,
      and radius of each ring should be configurable via props.
      Important: both textPath elements must be inside the same animated <g> for
      synchronized rotation. The center text must be outside that <g>.

      Example:
      <div class="orbit-rings" style="background:#042C53;border-radius:12px;padding:1rem;">
        <style>
          @scope {
            @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
          }
        </style>
        <svg width="100%" viewBox="0 0 300 300">
          <defs>
            <path id="outer" d="M 150 35  A 115 115 0 1 1 149.99 35"/>
            <path id="inner" d="M 150 68  A 82  82  0 1 1 149.99 68"/>
          </defs>
          <g style="transform-origin:150px 150px; animation:spin 14s linear infinite;">
            <text font-size="13" font-weight="700" font-family="sans-serif" fill="#9FE1CB" letter-spacing="3">
              <textPath href="#outer">★ SS2025 ★ SS2025 ★ SS2025 ★ SS2025 ★ SS20</textPath>
            </text>
            <text font-size="11" font-weight="500" font-family="sans-serif" fill="#5DCAA5" letter-spacing="2">
              <textPath href="#inner" startOffset="10%">LET YOUR MIND WONDER FREE · LET YOUR MIND WONDER FREE ·</textPath>
            </text>
          </g>
          <text x="150" y="158" text-anchor="middle" font-size="28" font-weight="900" font-family="sans-serif" fill="#ffffff">2025</text>
        </svg>
      </div>
    presentation:
      type: html-fragment
      html: |
