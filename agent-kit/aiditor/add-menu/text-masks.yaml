  - id: jay-text:path-shape-hover
    title: Shape path text (hover)
    category: Text
    subCategory: Masks & Effects
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
