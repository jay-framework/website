    prompt: |
      Add a "Shape Path Text" element to the page.
      Text flows along a custom SVG path defining a recognisable shape (e.g. house,
      circle, arrow, heart). A dashed stroke on the same path provides a visible guide
      line. On hover, CSS transitions animate the font-size larger and shift the fill
      to an accent color — no JavaScript required, using a :hover selector on the
      wrapping SVG element with transition on the text element.
      The text content, path shape (d attribute), guide stroke color, text color,
      hover color, and letter-spacing should be configurable via props.
      The text string should repeat enough times to fill the full path perimeter.

      Example (house shape):
      <div class="shape-path" style="background:#f0eef8;border-radius:12px;padding:1rem;">
        <style>
          @scope {
            .sw text { transition: font-size 0.3s ease, fill 0.3s ease; }
            .sw:hover text { font-size: 20px !important; fill: #ef9f27 !important; }
          }
        </style>
        <svg class="sw" width="100%" viewBox="0 0 420 200" style="cursor:pointer;">
          <defs>
            <path id="sp" d="M 60 180 L 60 100 L 210 30 L 360 100 L 360 180 L 60 180" fill="none"/>
