  - id: jay-text:responsive-fluid-clamp
    title: Responsive · fluid clamp scale
    category: Text
    subCategory: Typography / Responsive
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Apply fluid clamp responsive scaling to the text component at this marker location.
    prompt: |
      Apply "Fluid Clamp" responsive font sizing to the target text component.
      This is a modifier — it adjusts the font-size property of an existing text element,
      not a standalone component. Replace any fixed font-size with a clamp() value that
      sets a minimum (for small screens), a preferred fluid value (using vw or a
      combination of rem + vw), and a maximum (for large screens).
      The min, preferred, and max values should be tuned to the specific heading level:

      H1: clamp(28px, 2rem + 2.5vw, 48px)
      H2: clamp(22px, 1.5rem + 1.5vw, 36px)
      H3: clamp(18px, 1.1rem + 1vw,  28px)
      H4: clamp(15px, 0.9rem + 0.7vw, 22px)
      H5: clamp(13px, 0.8rem + 0.4vw, 17px)
      body: clamp(14px, 0.85rem + 0.2vw, 16px)

      No media queries are needed. The font size transitions smoothly between
      the min and max as the viewport grows.

      Example (applied to an H1):
      <style>
        @scope {
          h1 { font-size: clamp(28px, 2rem + 2.5vw, 48px); }
        }
      </style>
    presentation:
      type: html-fragment
      html: |
        <div class="responsive-clamp-widget">
          <style>
            @scope {
              .head { font-family: Georgia, serif; font-size: clamp(28px, 2rem + 2.5vw, 48px); font-weight: 700; line-height: 1.15; margin: 0; }
              .note { font-size: 11px; color: #888780; font-family: monospace; margin-top: 6px; }
              .badge { font-size:10px; background:#EEEDFE; color:#534AB7; border-radius:999px; padding:2px 8px; margin-top:8px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <h2 class="head">Fluid type scale</h2>
          <div class="note">font-size: clamp(28px, 2rem + 2.5vw, 48px)</div>
          <div class="badge">modifier · apply to any text</div>
        </div>
    browse:
      size: medium
  - id: jay-text:responsive-vw-hero
    title: Responsive · viewport-relative hero
    category: Text
    subCategory: Typography / Responsive
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Apply viewport-relative hero sizing to the text component at this marker location.
    prompt: |
      Apply "Viewport-Relative Hero" responsive sizing to the target text component.
      This is a modifier — it adjusts the font-size of an existing large display or
      hero heading to scale proportionally with the viewport width using vw units.
      Always wrap the vw value in clamp() to prevent the text from becoming too small
      on mobile or too large on very wide screens.
      Use only for hero headings, large display text, or banner titles — never for
      body copy, captions, or UI labels.

      Recommended values:
      Large hero:   clamp(32px, 6vw,  96px)
      Medium hero:  clamp(24px, 4vw,  72px)
      Display only: clamp(48px, 8vw, 120px)

      Example (large hero heading):
      <style>
        @scope {
          .hero-heading {
            font-size: clamp(32px, 6vw, 96px);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.03em;
          }
        }
      </style>
    presentation:
      type: html-fragment
      html: |
        <div class="responsive-vw-widget">
          <style>
            @scope {
              .head { font-family: Georgia, serif; font-size: clamp(32px, 6vw, 96px); font-weight: 900; line-height: 1.05; letter-spacing: -0.03em; margin: 0; }
              .note { font-size: 11px; color: #888780; font-family: monospace; margin-top: 6px; }
              .badge { font-size:10px; background:#E6F1FB; color:#185FA5; border-radius:999px; padding:2px 8px; margin-top:8px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <h1 class="head">Big idea.</h1>
          <div class="note">font-size: clamp(32px, 6vw, 96px)</div>
          <div class="badge">modifier · hero text only</div>
        </div>
    browse:
      size: large
  - id: jay-text:responsive-stepped-breakpoints
    title: Responsive · stepped breakpoints
    category: Text
    subCategory: Typography / Responsive
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Apply stepped breakpoint responsive sizing to the text component at this marker location.
    prompt: |
      Apply "Stepped Breakpoints" responsive font sizing to the target text component.
      This is a modifier — it adds explicit @media queries to an existing text element,
      setting a fixed font-size at each breakpoint. Use this when the design is
      spec'd at specific pixel values per screen size and you need predictable, exact
      sizing with no fluid transitions between breakpoints.

      Standard breakpoint scale:
      Mobile  (default, < 640px):  22px
      Tablet  (>= 640px):          30px
      Desktop (>= 1024px):         40px

      Adjust these values to match the specific heading level. H2 might use
      18px / 26px / 34px; body text 14px / 15px / 16px.

      Example (applied to an H2):
      <style>
        @scope {
          .head { font-size: 22px; }

          @media (min-width: 640px) {
            .head { font-size: 30px; }
          }
          @media (min-width: 1024px) {
            .head { font-size: 40px; }
          }
        }
      </style>
    presentation:
      type: html-fragment
      html: |
        <div class="responsive-stepped-widget">
          <style>
            @scope {
              .head { font-family: Georgia, serif; font-size: 22px; font-weight: 700; line-height: 1.2; margin: 0; }
              @media (min-width: 640px)  { .head { font-size: 30px; } }
              @media (min-width: 1024px) { .head { font-size: 40px; } }
              .note { font-size: 11px; color: #888780; font-family: monospace; margin-top: 6px; line-height: 1.6; }
              .badge { font-size:10px; background:#EAF3DE; color:#3B6D11; border-radius:999px; padding:2px 8px; margin-top:8px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <h2 class="head">The craft of design</h2>
          <div class="note">22px · 30px · 40px<br>mobile · tablet · desktop</div>
          <div class="badge">modifier · stepped sizes</div>
        </div>
    browse:
      size: medium
