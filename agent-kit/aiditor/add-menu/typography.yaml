items:
  - id: jay-text:editorial-heading
    title: Editorial heading
    category: Text
    subCategory: Typography
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add an editorial heading component at this marker location on the page.
    prompt: |
      Add an "Editorial Heading" text element to the page.
      A serif heading with a bold red left border rule. Font size uses clamp() for
      fluid responsiveness — never too small on mobile, never too large on desktop.
      The border color, font size range, and text content should be configurable via props.

      Example:
      <div class="editorial-heading">
        <style>
          @scope {
            .head {
              font-family: Georgia, serif;
              font-size: clamp(22px, 2rem + 1vw, 32px);
              font-weight: 700;
              line-height: 1.15;
              border-left: 3px solid #e24b4a;
              padding-left: 14px;
              margin: 0;
            }
          }
        </style>
        <h2 class="head">The future belongs to those who show up early.</h2>
      </div>
    presentation:
      type: html-fragment
      html: |
        <div class="editorial-heading-widget">
          <style>
            @scope {
              .head {
                font-family: Georgia, serif;
                font-size: clamp(22px, 2rem + 1vw, 32px);
                font-weight: 700;
                line-height: 1.15;
                color: #1a1a1a;
                border-left: 3px solid #e24b4a;
                padding-left: 14px;
                margin: 0;
              }
              .badge { font-size:10px; background:#FCEBEB; color:#A32D2D; border-radius:999px; padding:2px 8px; margin-top:8px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <h2 class="head">The future belongs to those who show up early.</h2>
          <div class="badge">editorial heading</div>
        </div>
    browse:
      size: medium
  - id: jay-text:display-heading
    title: Display heading
    category: Text
    subCategory: Typography
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a display heading with kicker at this marker location on the page.
    prompt: |
      Add a "Display Heading" element to the page.
      Consists of a small all-caps kicker label above a large italic serif heading.
      The kicker sets context; the heading delivers the message. Font size uses clamp()
      for fluid scaling. The kicker text, kicker color, and heading text should be
      configurable via props.

      Example:
      <div class="display-heading">
        <style>
          @scope {
            .kicker {
              font-size: 10px;
              font-weight: 700;
              letter-spacing: 0.2em;
              text-transform: uppercase;
              color: #185FA5;
              font-family: sans-serif;
              margin: 0 0 4px;
            }
            .head {
              font-family: Georgia, serif;
              font-size: clamp(20px, 1.5rem + 1.5vw, 28px);
              font-weight: 400;
              font-style: italic;
              margin: 0;
              line-height: 1.2;
            }
          }
        </style>
        <p class="kicker">Weekly dispatch</p>
        <h2 class="head">What nobody tells you about starting over.</h2>
      </div>
    presentation:
      type: html-fragment
      html: |
        <div class="display-heading-widget">
          <style>
            @scope {
              .kicker {
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: #185FA5;
                font-family: sans-serif;
                margin: 0 0 4px;
              }
              .head {
                font-family: Georgia, serif;
                font-size: clamp(20px, 1.5rem + 1.5vw, 28px);
                font-weight: 400;
                font-style: italic;
                color: #1a1a1a;
                margin: 0;
                line-height: 1.2;
              }
              .badge { font-size:10px; background:#E6F1FB; color:#185FA5; border-radius:999px; padding:2px 8px; margin-top:8px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <p class="kicker">Weekly dispatch</p>
          <h2 class="head">What nobody tells you about starting over.</h2>
          <div class="badge">display heading</div>
        </div>
    browse:
      size: medium
  - id: jay-text:animated-underline-heading
    title: Animated underline heading
    category: Text
    subCategory: Typography
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add an animated underline heading at this marker location on the page.
    prompt: |
      Add an "Animated Underline Heading" to the page.
      A sans-serif bold heading where a colored underline animates in from left to right
      on load using CSS @keyframes on the width property of a ::after pseudo-element.
      Font size uses clamp() for fluid scaling.
      The text, underline color, and animation duration should be configurable via props.

      Example:
      <div class="underline-heading">
        <style>
          @scope {
            @keyframes underline-grow {
              from { width: 0; }
              to   { width: 100%; }
            }
            .head {
              font-family: sans-serif;
              font-size: clamp(18px, 1rem + 1.5vw, 24px);
              font-weight: 700;
              margin: 0;
              display: inline-block;
              position: relative;
              padding-bottom: 4px;
            }
            .head::after {
              content: '';
              position: absolute;
              bottom: 0; left: 0;
              height: 3px;
              background: #7f77dd;
              animation: underline-grow 1.2s ease forwards;
              width: 100%;
            }
          }
        </style>
        <h2 class="head">Design that lasts</h2>
      </div>
    presentation:
      type: html-fragment
      html: |
        <div class="underline-heading-widget">
          <style>
            @scope {
              @keyframes underline-grow { from { width: 0; } to { width: 100%; } }
              .head {
                font-family: sans-serif;
                font-size: clamp(18px, 1rem + 1.5vw, 24px);
                font-weight: 700;
                color: #1a1a1a;
                margin: 0;
                display: inline-block;
                position: relative;
                padding-bottom: 4px;
              }
              .head::after {
                content: '';
                position: absolute;
                bottom: 0; left: 0;
                height: 3px;
                background: #7f77dd;
                animation: underline-grow 1.2s ease forwards;
                width: 100%;
              }
              .badge { font-size:10px; background:#EEEDFE; color:#534AB7; border-radius:999px; padding:2px 8px; margin-top:10px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <h2 class="head">Design that lasts</h2>
          <div class="badge">animated underline</div>
        </div>
    browse:
      size: medium
  - id: jay-text:stacked-heading
    title: Stacked heading
    category: Text
    subCategory: Typography
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a stacked heading with overline and subhead at this marker location on the page.
    prompt: |
      Add a "Stacked Heading" element to the page.
      Three-level typographic stack: a small tracked overline label at the top, a heavy
      sans-serif display heading in the middle, and a lighter subhead below. Each level
      uses distinct weight, size, and color to create clear visual hierarchy without
      color as the sole differentiator. Font size uses clamp() for fluid scaling.
      All three text strings and colors should be configurable via props.

      Example:
      <div class="stacked-heading">
        <style>
          @scope {
            .overline { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: #888780; font-family: sans-serif; margin: 0; }
            .head { font-family: sans-serif; font-size: clamp(20px, 1.5rem + 1vw, 26px); font-weight: 800; margin: 2px 0 0; letter-spacing: -0.02em; }
            .sub { font-family: sans-serif; font-size: 13px; color: #5F5E5A; margin: 4px 0 0; line-height: 1.5; }
          }
        </style>
        <p class="overline">Studio update</p>
        <h2 class="head">Less noise. More signal.</h2>
        <p class="sub">A framework for building products that people actually want to use.</p>
      </div>
    presentation:
      type: html-fragment
      html: |
        <div class="stacked-heading-widget">
          <style>
            @scope {
              .overline { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: #888780; font-family: sans-serif; margin: 0; }
              .head { font-family: sans-serif; font-size: clamp(20px, 1.5rem + 1vw, 26px); font-weight: 800; color: #1a1a1a; margin: 2px 0 0; letter-spacing: -0.02em; }
              .sub { font-family: sans-serif; font-size: 13px; color: #5F5E5A; margin: 4px 0 0; line-height: 1.5; }
              .badge { font-size:10px; background:#F1EFE8; color:#444441; border-radius:999px; padding:2px 8px; margin-top:8px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <p class="overline">Studio update</p>
          <h2 class="head">Less noise.<br>More signal.</h2>
          <p class="sub">A framework for building products that people actually want to use.</p>
          <div class="badge">stacked heading</div>
        </div>
    browse:
      size: medium
  - id: jay-text:heading-scale
    title: Heading scale H1–H6
    category: Text
    subCategory: Typography
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a full H1–H6 heading hierarchy at this marker location on the page.
    prompt: |
      Add a full "Heading Scale" H1–H6 hierarchy to the page.
      Each heading level has a distinct size, weight, and style that decreases in visual
      prominence. H1–H5 use Georgia serif; H6 breaks to sans-serif with uppercase tracking
      to serve as an eyebrow/label. All sizes use clamp() for fluid responsive scaling.
      H5 is italic to distinguish it from H4 without relying solely on size.
      The font family, size range, and heading text for each level should be configurable
      via props. Apply only the levels needed for the document structure.

      Example:
      <div class="heading-scale">
        <style>
          @scope {
            h1 { font-family: Georgia, serif; font-size: clamp(28px, 2rem + 2vw, 40px);   font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; }
            h2 { font-family: Georgia, serif; font-size: clamp(22px, 1.5rem + 1vw, 32px); font-weight: 700; line-height: 1.2; }
            h3 { font-family: Georgia, serif; font-size: clamp(18px, 1.1rem + 0.8vw, 26px); font-weight: 600; }
            h4 { font-family: Georgia, serif; font-size: clamp(15px, 0.9rem + 0.5vw, 20px); font-weight: 600; }
            h5 { font-family: Georgia, serif; font-size: clamp(13px, 0.8rem + 0.3vw, 16px); font-weight: 600; font-style: italic; }
            h6 { font-family: sans-serif;     font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #888780; }
          }
        </style>
        <h1>Page title</h1>
        <h2>Section heading</h2>
        <h3>Subsection heading</h3>
        <h4>Group heading</h4>
        <h5>Minor heading</h5>
        <h6>Label / eyebrow</h6>
      </div>
    presentation:
      type: html-fragment
      html: |
        <div class="heading-scale-widget">
          <style>
            @scope {
              .h1 { font-family: Georgia, serif; font-size: clamp(28px, 2rem + 2vw, 40px); font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 4px; }
              .h2 { font-family: Georgia, serif; font-size: clamp(22px, 1.5rem + 1vw, 32px); font-weight: 700; line-height: 1.2; margin: 0 0 4px; }
              .h3 { font-family: Georgia, serif; font-size: clamp(18px, 1.1rem + 0.8vw, 26px); font-weight: 600; line-height: 1.25; margin: 0 0 4px; }
              .h4 { font-family: Georgia, serif; font-size: clamp(15px, 0.9rem + 0.5vw, 20px); font-weight: 600; line-height: 1.3; margin: 0 0 4px; }
              .h5 { font-family: Georgia, serif; font-size: clamp(13px, 0.8rem + 0.3vw, 16px); font-weight: 600; font-style: italic; line-height: 1.4; margin: 0 0 4px; }
              .h6 { font-family: sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #888780; margin: 0; }
              .badge { font-size:10px; background:#EEEDFE; color:#534AB7; border-radius:999px; padding:2px 8px; margin-top:10px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <h1 class="h1">Page title</h1>
          <h2 class="h2">Section heading</h2>
          <h3 class="h3">Subsection heading</h3>
          <h4 class="h4">Group heading</h4>
          <h5 class="h5">Minor heading</h5>
          <h6 class="h6">Label / eyebrow</h6>
          <div class="badge">H1 – H6 scale</div>
        </div>
    browse:
      size: medium
  - id: jay-text:drop-cap-paragraph
    title: Drop cap paragraph
    category: Text
    subCategory: Typography
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a drop cap editorial paragraph at this marker location on the page.
    prompt: |
      Add a "Drop Cap Paragraph" to the page.
      A serif editorial paragraph where the first letter is enlarged to ~3.4em,
      floated left, with a tighter line-height so it sits flush with the top of the
      text block. The drop cap uses a distinct accent color. The rest of the paragraph
      flows normally. Font size uses clamp() for fluid scaling.
      The paragraph text, drop cap color, and font size range should be configurable
      via props.

      Example:
      <div class="drop-cap">
        <style>
          @scope {
            .para {
              font-family: Georgia, serif;
              font-size: clamp(13px, 0.8rem + 0.3vw, 15px);
              line-height: 1.8;
              margin: 0;
            }
            .para::first-letter {
              font-size: 3.4em;
              font-weight: 700;
              float: left;
              line-height: 0.75;
              margin: 0.08em 0.08em 0 0;
              color: #e24b4a;
            }
          }
        </style>
        <p class="para">Every great design starts with an uncomfortable question...</p>
      </div>
    presentation:
      type: html-fragment
      html: |
        <div class="drop-cap-widget">
          <style>
            @scope {
              .para { font-family: Georgia, serif; font-size: clamp(13px, 0.8rem + 0.3vw, 15px); line-height: 1.8; margin: 0; }
              .para::first-letter { font-size: 3.4em; font-weight: 700; float: left; line-height: 0.75; margin: 0.08em 0.08em 0 0; color: #e24b4a; font-family: Georgia, serif; }
              .badge { font-size:10px; background:#EAF3DE; color:#3B6D11; border-radius:999px; padding:2px 8px; margin-top:8px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <p class="para">Every great design starts with an uncomfortable question. The kind that makes a room go quiet, that nobody wants to answer first. It is the question beneath the brief, the one the client forgot to ask. Finding it — and sitting with it long enough to understand it — is where the real work begins.</p>
          <div class="badge">drop cap paragraph</div>
        </div>
    browse:
      size: medium
  - id: jay-text:blockquote
    title: Blockquote
    category: Text
    subCategory: Typography
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a blockquote with attribution at this marker location on the page.
    prompt: |
      Add a "Blockquote" element to the page.
      An italic serif quote with a colored left border and a light tinted background.
      Attribution appears below in small sans-serif. Uses semantic <blockquote> and
      <cite> elements. Font size uses clamp() for fluid scaling.
      The quote text, attribution, border color, and background tint should be
      configurable via props.

      Example:
      <div class="blockquote">
        <style>
          @scope {
            .bq {
              margin: 0;
              padding: 12px 16px;
              border-left: 3px solid #ef9f27;
              background: #faeeda33;
              border-radius: 0 8px 8px 0;
            }
            .bq p    { font-family: Georgia, serif; font-size: clamp(14px, 0.9rem + 0.3vw, 16px); font-style: italic; line-height: 1.6; margin: 0 0 6px; }
            .bq cite { font-size: 12px; color: #888780; font-style: normal; font-family: sans-serif; }
          }
        </style>
        <blockquote class="bq">
          <p>Good design is as little design as possible.</p>
          <cite>— Dieter Rams</cite>
        </blockquote>
      </div>
    presentation:
      type: html-fragment
      html: |
        <div class="blockquote-widget">
          <style>
            @scope {
              .bq { margin: 0; padding: 12px 16px; border-left: 3px solid #ef9f27; background: #faeeda33; border-radius: 0 8px 8px 0; }
              .bq p { font-family: Georgia, serif; font-size: clamp(14px, 0.9rem + 0.3vw, 16px); font-style: italic; line-height: 1.6; margin: 0 0 6px; }
              .bq cite { font-size: 12px; color: #888780; font-style: normal; font-family: sans-serif; }
              .badge { font-size:10px; background:#FAEEDA; color:#633806; border-radius:999px; padding:2px 8px; margin-top:8px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <blockquote class="bq">
            <p>Good design is as little design as possible.</p>
            <cite>— Dieter Rams</cite>
          </blockquote>
          <div class="badge">blockquote</div>
        </div>
    browse:
      size: medium
  - id: jay-text:pull-quote
    title: Pull quote
    category: Text
    subCategory: Typography
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a centred pull quote at this marker location on the page.
    prompt: |
      Add a "Pull Quote" element to the page.
      A large centred italic serif quote with oversized decorative curly quotation marks
      rendered via CSS ::before and ::after pseudo-elements using Unicode characters
      \201C and \201D. The quote marks use an accent color distinct from the text.
      Font size uses clamp() for fluid scaling.
      The quote text and accent color should be configurable via props.

      Example:
      <div class="pull-quote">
        <style>
          @scope {
            .pq {
              font-family: Georgia, serif;
              font-size: clamp(16px, 1rem + 1vw, 22px);
              font-weight: 700;
              font-style: italic;
              line-height: 1.35;
              margin: 0;
              text-align: center;
            }
            .pq::before { content: '\201C'; font-size: 64px; color: #7f77dd; line-height: 0; vertical-align: -0.4em; margin-right: 4px; }
            .pq::after  { content: '\201D'; font-size: 64px; color: #7f77dd; line-height: 0; vertical-align: -0.4em; margin-left: 4px; }
          }
        </style>
        <p class="pq">Clarity is the ultimate sophistication.</p>
      </div>
    presentation:
      type: html-fragment
      html: |
        <div class="pull-quote-widget">
          <style>
            @scope {
              .pq { font-family: Georgia, serif; font-size: clamp(16px, 1rem + 1vw, 22px); font-weight: 700; font-style: italic; line-height: 1.35; margin: 0; text-align: center; }
              .pq::before { content: '\201C'; font-size: 64px; color: #7f77dd; line-height: 0; vertical-align: -0.4em; margin-right: 4px; }
              .pq::after  { content: '\201D'; font-size: 64px; color: #7f77dd; line-height: 0; vertical-align: -0.4em; margin-left: 4px; }
              .badge { font-size:10px; background:#EEEDFE; color:#3C3489; border-radius:999px; padding:2px 8px; margin-top:8px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <p class="pq">Clarity is the ultimate sophistication.</p>
          <div class="badge">pull quote</div>
        </div>
    browse:
      size: medium
  - id: jay-text:inline-code-caption
    title: Inline code with caption
    category: Text
    subCategory: Typography
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a paragraph with inline code and figure caption at this marker location.
    prompt: |
      Add an "Inline Code with Caption" text element to the page.
      A prose paragraph containing inline <code> elements styled with a monospace font,
      subtle background tint, and border. Below the paragraph, a figure caption in small
      muted sans-serif is separated by a hairline border-top.
      The paragraph content, inline code values, and caption text should be configurable
      via props.

      Example:
      <div class="code-caption">
        <style>
          @scope {
            .para { font-size: 13px; font-family: sans-serif; line-height: 1.7; margin: 0; }
            .para code {
              font-family: monospace;
              font-size: 12px;
              background: #F1EFE8;
              border: 0.5px solid #D3D1C7;
              border-radius: 4px;
              padding: 1px 5px;
              color: #185FA5;
            }
            .caption {
              font-size: 11px;
              color: #888780;
              font-family: sans-serif;
              margin-top: 6px;
              border-top: 0.5px solid #D3D1C7;
              padding-top: 6px;
            }
          }
        </style>
        <p class="para">Pass the <code>variant</code> prop to switch between <code>primary</code> and <code>ghost</code> styles.</p>
        <p class="caption">Figure 3 — Button variant API reference.</p>
      </div>
    presentation:
      type: html-fragment
      html: |
        <div class="code-caption-widget">
          <style>
            @scope {
              .para { font-size: 13px; font-family: sans-serif; line-height: 1.7; margin: 0; }
              .para code { font-family: monospace; font-size: 12px; background: #F1EFE8; border: 0.5px solid #D3D1C7; border-radius: 4px; padding: 1px 5px; color: #185FA5; }
              .caption { font-size: 11px; color: #888780; font-family: sans-serif; margin-top: 6px; border-top: 0.5px solid #D3D1C7; padding-top: 6px; }
              .badge { font-size:10px; background:#F1EFE8; color:#444441; border-radius:999px; padding:2px 8px; margin-top:8px; font-family:sans-serif; display:inline-block; }
            }
          </style>
          <p class="para">Pass the <code>variant</code> prop to switch between <code>primary</code>, <code>secondary</code>, and <code>ghost</code> button styles. Combine with <code>size="sm"</code> for compact layouts.</p>
          <p class="caption">Figure 3 — Button variant API reference. See design tokens for full color mapping.</p>
          <div class="badge">inline code + caption</div>
        </div>
    browse:
      size: small
  - id: jay-text:definition-list
    title: Definition list
    category: Text
    subCategory: Typography
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a definition list at this marker location on the page.
    prompt: |
      Add a "Definition List" element to the page.
      Uses semantic <dl>, <dt>, <dd> elements. Terms are rendered in small uppercase
      sans-serif with an accent color. Definitions are serif with a colored left border
      rule creating visual grouping. Multiple term/definition pairs are stacked with gap.
      The terms, definitions, and accent color should be configurable via props.

      Example:
      <div class="definition-list">
        <style>
          @scope {
            .dl { margin: 0; display: flex; flex-direction: column; gap: 8px; }
            .dl dt { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #185FA5; font-family: sans-serif; }
