      size: small
  - id: jay-text:quiet-stillness
    title: Quiet stillness
    category: Text
    subCategory: Personalities
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a quiet-stillness text component at this marker location on the page.
    prompt: |
      Add a "Quiet Stillness" text element to the page.
      This is deliberately the anti-animation: no keyframes, no movement whatsoever.
      The text is rendered with wide letter-spacing (0.35em), muted gray color, and a
      slightly reduced font size. Ellipsis dots may flank the word. The power comes from
      restraint — the absence of motion conveys melancholy and stillness.
      Do not add any animation. The text content, letter-spacing, and color should be
      configurable via props.

      Example:
      <div class="quiet-stillness">
        <style>
          @scope {
            .text {
              font-size: 16px;
              font-weight: 500;
              letter-spacing: 0.35em;
              color: #888780;
            }
          }
        </style>
        <div class="text">···stillness···</div>
