  - id: jay-text:letter-tumble
    title: Letter tumble
    category: Text
    subCategory: Personalities
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a letter-tumble animated text component at this marker location on the page.
    prompt: |
      Add a "Letter Tumble" text element to the page.
      Each letter drops in from slightly above (translateY -6px, opacity 0.4),
      overshoots slightly, then settles — using cubic-bezier(.36,.07,.19,.97) easing
      for a heavy, weighted feel. Letters animate in sequence with staggered delay
      (0.12s per character). Color is deep blue. The effect is sad and heavy.
      The text content, drop distance, and color should be configurable via props.

      Example:
      <div class="letter-tumble">
        <style>
          @scope {
            @keyframes fall {
              0%   { transform: translateY(-6px); opacity: 0.4; }
              60%  { transform: translateY(2px); }
              100% { transform: translateY(0);   opacity: 1; }
            }
            .text { display: flex; gap: 2px; font-size: 22px; font-weight: 500; color: #185FA5; }
            .text span { display: inline-block; animation: fall 2s cubic-bezier(.36,.07,.19,.97) infinite; }
            .text span:nth-child(1) { animation-delay: 0s; }
            .text span:nth-child(2) { animation-delay: .12s; }
            .text span:nth-child(3) { animation-delay: .24s; }
            .text span:nth-child(4) { animation-delay: .36s; }
            .text span:nth-child(5) { animation-delay: .48s; }
          }
        </style>
        <div class="text">
          <span>H</span><span>E</span><span>L</span><span>L</span><span>O</span>
        </div>
      </div>
    presentation:
      type: html-fragment
      html: |
        <div class="letter-tumble-widget">
          <style>
            @scope {
              @keyframes fall { 0%{transform:translateY(-6px);opacity:0.4} 60%{transform:translateY(2px)} 100%{transform:translateY(0);opacity:1} }
              .text { display: flex; gap: 2px; font-size: 22px; font-weight: 500; font-family: sans-serif; color: #185FA5; }
              .text span { display: inline-block; animation: fall 2s cubic-bezier(.36,.07,.19,.97) infinite; }
              .text span:nth-child(1){animation-delay:0s} .text span:nth-child(2){animation-delay:.12s} .text span:nth-child(3){animation-delay:.24s} .text span:nth-child(4){animation-delay:.36s} .text span:nth-child(5){animation-delay:.48s} .text span:nth-child(6){animation-delay:.6s} .text span:nth-child(7){animation-delay:.72s}
              .badge { font-size: 10px; background: #E6F1FB; color: #185FA5; border-radius: 999px; padding: 2px 8px; margin-top: 8px; font-family: sans-serif; }
            }
          </style>
          <div class="text"><span>S</span><span>I</span><span>N</span><span>K</span><span>I</span><span>N</span><span>G</span></div>
