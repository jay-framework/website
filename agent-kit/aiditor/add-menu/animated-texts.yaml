    category: Text
    subCategory: Personalities
    pluginName: aiditor-quill
    packageName: "@jay-framework/aiditor-quill"
    interaction:
      mode: stage-place
      stagePromptTemplate: |
        Add a staggered-fade animated text component at this marker location on the page.
    prompt: |
      Add a "Staggered Fade" text element to the page.
      Each letter independently fades between full opacity and near-invisible (0.15)
      using CSS @keyframes, with staggered animation-delay (0.2s per character).
      The result is a ghostly shimmer — letters flicker in and out at different times.
      Color is purple. The effect is haunting and mysterious.
      The text content, minimum opacity, and animation speed should be configurable via props.

      Example:
      <div class="staggered-fade">
        <style>
          @scope {
            @keyframes blink {
              0%,100% { opacity: 1; }
              50%     { opacity: 0.15; }
            }
            .text { display: flex; gap: 2px; font-size: 22px; font-weight: 500; color: #7f77dd; }
            .text span { display: inline-block; animation: blink 1.8s ease-in-out infinite; }
            .text span:nth-child(1) { animation-delay: 0s; }
            .text span:nth-child(2) { animation-delay: .2s; }
            .text span:nth-child(3) { animation-delay: .4s; }
            .text span:nth-child(4) { animation-delay: .6s; }
            .text span:nth-child(5) { animation-delay: .8s; }
          }
        </style>
        <div class="text">
          <span>H</span><span>E</span><span>L</span><span>L</span><span>O</span>
        </div>
      </div>
    presentation:
      type: html-fragment
